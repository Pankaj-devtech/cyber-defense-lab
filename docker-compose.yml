services:
  web:
    build: .
    container_name: cyber-defense-lab
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/cyber_defense.db
      SIMULATION_MODE: "true"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
